<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
      >
    <h:body>
        <ui:composition template="/template1.xhtml">
            <ui:define name="title" >
                #{letterController.selected.id eq null ? 'New ' : ''}#{letterController.outsideLetter ? 'Outside Letter' : 'Our Letter'}
            </ui:define>
            <ui:define name="content">
                <style>
                    .letter-entry {
                        max-width: 60em;
                        margin: 1em auto;
                    }
                    .letter-entry.ui-card .ui-card-title {
                        font-size: 1em;
                    }
                    .letter-entry-title {
                        font-weight: 600;
                    }
                    .letter-entry label,
                    .letter-entry .ui-outputlabel,
                    .letter-entry .letter-entry-label {
                        display: block;
                        font-weight: 600;
                        margin-bottom: 0.3em;
                    }
                    .letter-entry .ui-message {
                        margin: 0.25em 0 0 0;
                    }
                    .letter-entry .ui-message:empty {
                        display: none;
                    }
                    .letter-entry .letter-entry-hint {
                        font-size: 0.85em;
                        margin-bottom: 0.3em;
                    }
                    .letter-entry .letter-entry-section {
                        margin-top: 1em;
                    }
                    .letter-entry .ui-fileupload-content {
                        padding: 0.75em;
                    }
                    .letter-entry .letter-entry-file {
                        display: flex;
                        align-items: center;
                        gap: 0.5em;
                        padding: 0.35em 0;
                        border-bottom: 1px solid var(--surface-d, #dee2e6);
                    }
                    .letter-entry .letter-entry-file-name {
                        flex: 1;
                        overflow-wrap: anywhere;
                    }
                    /* Title left, buttons centred on the same row: the equal 1fr side
                       columns keep the buttons centred whatever the title length. */
                    .letter-entry .letter-entry-header {
                        display: grid;
                        grid-template-columns: 1fr auto 1fr;
                        align-items: center;
                        gap: 0.6em;
                    }
                    .letter-entry .letter-entry-actions {
                        display: flex;
                        justify-content: center;
                        gap: 0.5em;
                    }
                </style>

                <h:form id="letterForm" enctype="multipart/form-data">
                    <p:card styleClass="letter-entry">
                        <f:facet name="title">
                            <div class="letter-entry-header">
                                <h:panelGroup id="letterId" layout="block">
                                    <h:outputText value="#{letterController.selected.id eq null ? 'New ' : ''}#{letterController.outsideLetter ? 'Outside Letter' : 'Our Letter'}"
                                                  styleClass="letter-entry-title" />
                                    <h:outputText value=" - #{letterController.selected.id}" styleClass="letter-entry-title"
                                                  rendered="#{letterController.selected.id ne null}" />
                                </h:panelGroup>
                                <div class="letter-entry-actions">
                                    <p:commandButton id="btnSaveAdd" tabindex="10" ajax="false"
                                                     styleClass="ui-button-success" icon="pi pi-check"
                                                     action="#{letterController.saveAndViewReceivedLetter()}"
                                                     value="Save &amp; View" />
                                    <p:commandButton tabindex="10" ajax="false"
                                                     styleClass="ui-button-warning" icon="pi pi-plus"
                                                     action="#{letterController.saveAndNewReceivedLetter()}"
                                                     value="Save &amp; New" />
                                </div>
                            </div>
                        </f:facet>

                        <p:messages id="msgs" closable="true" globalOnly="true" />

                        <div class="ui-fluid">
                            <div class="row g-3">

                                <div class="col-md-4">
                                    <p:outputLabel for="letterDate" value="Letter Date" />
                                    <p:datePicker id="letterDate"
                                                  value="#{letterController.selected.documentDate}"
                                                  monthNavigator="true"
                                                  yearNavigator="true"
                                                  required="false" pattern="dd/MM/yyyy">
                                        <p:ajax event="blur" process="@this" global="false" />
                                    </p:datePicker>
                                    <p:message for="letterDate" display="text" />
                                </div>

                                <h:panelGroup layout="block" class="col-md-4" rendered="#{letterController.outsideLetter}">
                                    <p:outputLabel for="receivedDate" value="Stamp Date" />
                                    <p:datePicker id="receivedDate" value="#{letterController.selected.receivedDate}"
                                                  required="true" pattern="dd/MM/yyyy" requiredMessage="Need a Received Date"
                                                  monthNavigator="true"
                                                  yearNavigator="true">
                                        <p:ajax event="blur" process="@this" global="false" />
                                    </p:datePicker>
                                    <p:message for="receivedDate" display="text" />
                                </h:panelGroup>

                                <div class="col-md-4">
                                    <p:outputLabel for="title" value="Letter Number" />
                                    <p:inputText id="title"
                                                 autocomplete="off"
                                                 value="#{letterController.selected.documentNumber}">
                                        <p:ajax event="blur" process="@this" global="false" />
                                    </p:inputText>
                                    <p:message for="title" display="text" />
                                </div>

                                <div class="col-md-4">
                                    <p:outputLabel for="method"
                                                   value="#{letterController.outsideLetter ? 'Received Method' : 'Sending Method'}" />
                                    <p:selectOneMenu id="method" value="#{letterController.selected.receivedAs}">
                                        <p:ajax event="change" process="@this" update="regNo" global="false" />
                                        <f:selectItem itemLabel="Select" />
                                        <f:selectItems value="#{itemApplicationController.letterReceiveCategories}"
                                                       var="i"
                                                       itemLabel="#{i.name}"
                                                       itemValue="#{i}" />
                                    </p:selectOneMenu>
                                    <p:message for="method" display="text" />
                                </div>

                                <div class="col-md-4">
                                    <p:outputLabel for="lang" value="Language" />
                                    <p:selectOneMenu id="lang"
                                                     value="#{letterController.selected.documentLanguage}">
                                        <f:selectItem itemLabel="Select" />
                                        <f:selectItems value="#{itemApplicationController.documentLanguages}"
                                                       var="d"
                                                       itemLabel="#{d.name}"
                                                       itemValue="#{d}" />
                                        <p:ajax event="blur" process="@this" global="false" />
                                    </p:selectOneMenu>
                                    <p:message for="lang" display="text" />
                                </div>

                                <h:panelGroup id="regNo" layout="block" class="col-md-4">
                                    <h:panelGroup rendered="#{letterController.selected.receivedAs.code eq 'letter_receive_category_registered_post' or letterController.selected.receivedAs.code eq 'speed_post'}">
                                        <p:outputLabel for="registrationNo" value="Registration No." />
                                        <p:inputText id="registrationNo"
                                                     placeholder="Enter Registration No."
                                                     value="#{letterController.selected.registrationNo}">
                                            <p:ajax event="blur" process="@this" global="false" />
                                        </p:inputText>
                                    </h:panelGroup>
                                </h:panelGroup>

                                <h:panelGroup layout="block" class="col-12" rendered="#{letterController.outsideLetter}">
                                    <p:outputLabel for="from" value="From" />
                                    <p:autoComplete id="from" value="#{letterController.selected.fromInsOrUser}"
                                                    completeMethod="#{letterController.completeInsOrUsersByWords}"
                                                    var="insf"
                                                    forceSelection="true"
                                                    required="true"
                                                    requiredMessage="Need to select"
                                                    placeholder="Type at least 3 letters of the institution or person"
                                                    maxResults="10"
                                                    itemLabel="#{insf.displayName}"
                                                    itemValue="#{insf}"
                                                    delay="500"
                                                    minQueryLength="3"
                                                    cache="false">
                                        <p:ajax event="itemSelect"
                                                listener="#{letterController.saveCurrentDocumentAjax}"
                                                process="from"
                                                update="letterId fromPerson from"
                                                global="false" />
                                    </p:autoComplete>
                                    <p:message for="from" display="text" />
                                    <h:panelGroup id="fromPerson" layout="block">
                                        <p:inputText placeholder="Enter Persons or Institution Name" styleClass="mt-2"
                                                     rendered="#{letterController.selected.fromInstitution.name eq 'Personal' or letterController.selected.fromInstitution.name eq 'Other'}"
                                                     value="#{letterController.selected.senderName}" />
                                    </h:panelGroup>
                                </h:panelGroup>

                                <h:panelGroup layout="block" class="col-12" rendered="#{not letterController.outsideLetter}">
                                    <p:outputLabel for="to" value="To" />
                                    <div class="text-muted letter-entry-hint">
                                        <h:outputText value="From: #{webUserController.loggedInstitution.name}" />
                                    </div>
                                    <p:autoComplete id="to" value="#{letterController.selected.toInsOrUser}"
                                                    completeMethod="#{letterController.completeInsOrUsersByWords}"
                                                    var="insf"
                                                    forceSelection="true"
                                                    required="true"
                                                    requiredMessage="Need to select"
                                                    placeholder="Type at least 3 letters of the institution or person"
                                                    maxResults="10"
                                                    itemLabel="#{insf.displayName}"
                                                    itemValue="#{insf}"
                                                    delay="500"
                                                    minQueryLength="3"
                                                    cache="false">
                                        <p:ajax event="itemSelect"
                                                listener="#{letterController.saveCurrentDocumentAjax}"
                                                process="to"
                                                update="letterId toPerson to"
                                                global="false" />
                                    </p:autoComplete>
                                    <p:message for="to" display="text" />
                                    <h:panelGroup id="toPerson" layout="block">
                                        <p:inputText placeholder="Enter Persons or Institution Name" styleClass="mt-2"
                                                     rendered="#{letterController.selected.toInstitution.name eq 'Personal' or letterController.selected.toInstitution.name eq 'Other'}"
                                                     value="#{letterController.selected.senderName}" />
                                    </h:panelGroup>
                                </h:panelGroup>

                                <div class="col-12">
                                    <p:outputLabel for="topic" value="Letter Title" />
                                    <p:inputTextarea id="topic"
                                                     rows="2"
                                                     maxlength="255"
                                                     autoResize="true"
                                                     value="#{letterController.selected.documentName}"
                                                     required="true" requiredMessage="Need a Title">
                                        <p:ajax event="blur" process="@this" global="false" />
                                    </p:inputTextarea>
                                    <p:message for="topic" display="text" />
                                </div>

                                <div class="col-12">
                                    <p:outputLabel for="comments" value="Letter Details" />
                                    <p:inputTextarea id="comments" rows="3" autoResize="true"
                                                     value="#{letterController.selected.comments}" />
                                </div>


                            </div>
                        </div>

                        <div class="letter-entry-section">
                            <h:outputText value="Scanned Copy (PDF/Images)" styleClass="letter-entry-label" />
                            <div class="text-muted letter-entry-hint">
                                Drop files here or choose them. They are attached when the letter is saved.
                            </div>
                            <p:fileUpload id="scan"
                                          mode="advanced" auto="true" multiple="true" sequential="true"
                                          dragDropSupport="true"
                                          listener="#{letterController.handlePendingUpload}"
                                          process="@this" update="pendingFiles msgs" global="false"
                                          accept=".pdf,image/*"
                                          allowTypes="/(\.|\/)(pdf|jpe?g|png|gif|tiff?|bmp|webp)$/i"
                                          sizeLimit="20971520"
                                          label="Choose Files" chooseIcon="pi pi-paperclip" />
                            <h:panelGroup id="pendingFiles" layout="block">
                                <ui:repeat value="#{letterController.pendingUploads}" var="pu">
                                    <div class="letter-entry-file">
                                        <i class="pi #{pu.pdf ? 'pi-file-pdf' : 'pi-image'}" />
                                        <h:outputText value="#{pu.fileName}" styleClass="letter-entry-file-name" />
                                        <p:commandButton icon="pi pi-times" title="Remove"
                                                         styleClass="rounded-button ui-button-danger ui-button-flat"
                                                         action="#{letterController.removePendingUpload(pu)}"
                                                         process="@this" update="@form:pendingFiles" global="false" />
                                    </div>
                                </ui:repeat>
                            </h:panelGroup>
                        </div>

                        <p:defaultCommand target="btnSaveAdd" />
                    </p:card>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
