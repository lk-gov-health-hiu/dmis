<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:body>
        <ui:composition template="/template1.xhtml">
            <ui:define name="title">
                Search Letters by Date
            </ui:define>
            <ui:define name="content">
                <p:growl />
                <h:form id="reportForm">
                    <p:card styleClass="report-card">
                        <f:facet name="title">
                            <div class="report-card-header">
                                <h:outputText value="Search Letters by Date" styleClass="report-card-title" />
                                <div class="report-card-actions">
                                    <p:commandButton value="Search" icon="pi pi-search" ajax="false"
                                                     styleClass="ui-button-warning"
                                                     action="#{letterController.searchLetterByDate}" />
                                    <p:commandButton value="Print" icon="pi pi-print" type="button"
                                                     styleClass="ui-button-info">
                                        <p:printer target="gridPrint" />
                                    </p:commandButton>
                                    <p:commandButton value="Download" icon="pi pi-file-excel" ajax="false"
                                                     styleClass="ui-button-success">
                                        <p:dataExporter target="tbl" type="xls" fileName="Letters by Date" />
                                    </p:commandButton>
                                </div>
                            </div>
                        </f:facet>

                        <div class="ui-fluid report-filters">
                            <div class="row g-2">
                                <div class="col-md-3">
                                    <p:outputLabel for="filterBy" value="Filter By" />
                                    <p:selectOneMenu id="filterBy" value="#{letterController.searchFilterType}">
                                        <f:selectItems value="#{commonController.searchFilterTypes}" var="sft"
                                                       itemLabel="#{sft.label}" itemValue="#{sft}" />
                                    </p:selectOneMenu>
                                </div>
                                <div class="col-md-3">
                                    <p:outputLabel for="fromDate" value="From Date" />
                                    <p:datePicker id="fromDate" showTime="true" hourFormat="12"
                                                  showButtonBar="true" panelStyleClass="report-datepicker"
                                                  pattern="dd MMMM yyyy hh:mm a"
                                                  value="#{letterController.fromDate}" />
                                </div>
                                <div class="col-md-3">
                                    <p:outputLabel for="toDate" value="To Date" />
                                    <p:datePicker id="toDate" showTime="true" hourFormat="12"
                                                  showButtonBar="true" panelStyleClass="report-datepicker"
                                                  pattern="dd MMMM yyyy hh:mm a"
                                                  value="#{letterController.toDate}" />
                                </div>
                            </div>
                        </div>

                        <p:dataTable reflow="false" id="tbl" value="#{letterController.items}"
                                     styleClass="report-table"
                                     var="h" rowKey="#{h.id}" paginator="true"
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                                     rowsPerPageTemplate="10,25,100,{ShowAll|'All'}" rows="10"
                                     emptyMessage="No letters found. Select the criteria and click Search.">
                            <p:column headerText="ID"
                                      sortBy="#{h.id}" filterBy="#{h.id}" filterMatchMode="contains">
                                <h:outputText value="#{h.id}" />
                            </p:column>
                            <p:column headerText="Letter Date"
                                      sortBy="#{h.documentDate}">
                                <h:outputText value="#{h.documentDate}"><f:convertDateTime pattern="dd MMM yyyy" /></h:outputText>
                            </p:column>
                            <p:column headerText="Stamp Date"
                                      sortBy="#{h.receivedDate}">
                                <h:outputText value="#{h.receivedDate}"><f:convertDateTime pattern="dd MMM yyyy" /></h:outputText>
                            </p:column>
                            <p:column headerText="Receive Method"
                                      sortBy="#{h.receivedAs.name}" filterBy="#{h.receivedAs.name}" filterMatchMode="contains">
                                <h:outputText value="#{h.receivedAs.name}" />
                            </p:column>
                            <p:column headerText="Letter Number"
                                      sortBy="#{h.documentNumber}" filterBy="#{h.documentNumber}" filterMatchMode="contains">
                                <h:outputText value="#{h.documentNumber}" />
                            </p:column>
                            <p:column headerText="Title"
                                      sortBy="#{h.documentName}" filterBy="#{h.documentName}" filterMatchMode="contains">
                                <h:outputText value="#{h.documentName}" />
                            </p:column>
                            <p:column headerText="From"
                                      sortBy="#{h.fromInstitution.name}" filterBy="#{h.fromInstitution.name}" filterMatchMode="contains">
                                <h:outputText rendered="#{h.fromInstitution.name eq 'Personal'}" value="#{h.senderName}" /><h:outputText rendered="#{h.fromInstitution.name ne 'Personal'}" value="#{h.fromInstitution.name}" /><h:outputText rendered="#{h.fromWebUser.person ne null}" value=" (#{h.fromWebUser.person.nameWithTitle})" />
                            </p:column>
                            <p:column headerText="Actions" exportable="false" style="width:7em">
                                <div class="report-row-actions">
                                    <p:commandButton value="View" icon="pi pi-eye" ajax="false" styleClass="ui-button-info"
                                                     action="#{letterController.toLetterView()}">
                                        <f:setPropertyActionListener target="#{letterController.selected}" value="#{h}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>

                        <!-- Printed register: plain monospace table for dot-matrix printers (scss/src/print.scss).
                             Hidden on screen; p:printer prints only this panel. -->
                        <h:panelGroup layout="block" id="gridPrint" styleClass="print-doc d-none d-print-block">
                            <ui:include src="/WEB-INF/includes/print_header.xhtml">
                                <ui:param name="title" value="Search Letters by Date" />
                                <ui:param name="fromDate" value="#{letterController.fromDate}" />
                                <ui:param name="toDate" value="#{letterController.toDate}" />
                                <ui:param name="filterText" value="#{'Date filter: ' += (empty letterController.searchFilterType ? '' : letterController.searchFilterType.label)}" />
                            </ui:include>
                            <table class="pd-table">
                                <thead>
                                    <tr>
                                        <th style="width:3%">No.</th>
                                        <th style="width:7%">ID</th>
                                        <th style="width:9%">Letter Date</th>
                                        <th style="width:9%">Stamp Date</th>
                                        <th style="width:10%">Receive Method</th>
                                        <th style="width:12%">Letter Number</th>
                                        <th>Title</th>
                                        <th style="width:20%">From</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <ui:repeat value="#{letterController.items}" var="h" varStatus="s">
                                        <tr>
                                            <td><h:outputText value="#{s.index + 1}" /></td>
                                            <td><h:outputText value="#{h.id}" /></td>
                                            <td><h:outputText value="#{h.documentDate}"><f:convertDateTime pattern="dd/MM/yyyy" /></h:outputText></td>
                                            <td><h:outputText value="#{h.receivedDate}"><f:convertDateTime pattern="dd/MM/yyyy" /></h:outputText></td>
                                            <td><h:outputText value="#{h.receivedAs.name}" /></td>
                                            <td><h:outputText value="#{h.documentNumber}" /></td>
                                            <td><h:outputText value="#{h.documentName}" /></td>
                                            <td><h:outputText rendered="#{h.fromInstitution.name eq 'Personal'}" value="#{h.senderName}" /><h:outputText rendered="#{h.fromInstitution.name ne 'Personal'}" value="#{h.fromInstitution.name}" /><h:outputText rendered="#{h.fromWebUser.person ne null}" value=" (#{h.fromWebUser.person.nameWithTitle})" /></td>
                                        </tr>
                                    </ui:repeat>
                                </tbody>
                            </table>
                            <ui:include src="/WEB-INF/includes/print_footer.xhtml">
                                <ui:param name="count" value="#{empty letterController.items ? 0 : letterController.items.size()}" />
                                <ui:param name="signatures" value="#{false}" />
                            </ui:include>
                        </h:panelGroup>
                    </p:card>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
