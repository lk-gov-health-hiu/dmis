<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:body>
        <ui:composition template="/template1.xhtml">
            <ui:define name="title">
                My Assigned &amp; Accepted Letters
            </ui:define>
            <ui:define name="content">
                <p:growl />
                <h:form id="reportForm">
                    <p:card styleClass="report-card">
                        <f:facet name="title">
                            <div class="report-card-header">
                                <h:outputText value="My Assigned &amp; Accepted Letters" styleClass="report-card-title" />
                                <div class="report-card-actions">
                                    <p:commandButton value="Process" icon="pi pi-search" ajax="false"
                                                     styleClass="ui-button-warning"
                                                     action="#{letterController.fillMyAcceptedLetters()}" />
                                    <p:commandButton value="Print" icon="pi pi-print" type="button"
                                                     styleClass="ui-button-info">
                                        <p:printer target="gridPrint" />
                                    </p:commandButton>
                                    <p:commandButton value="Download" icon="pi pi-file-excel" ajax="false"
                                                     styleClass="ui-button-success">
                                        <p:dataExporter target="tbl" type="xls" fileName="My Assigned and Accepted Letters" />
                                    </p:commandButton>
                                </div>
                            </div>
                        </f:facet>

                        <div class="ui-fluid report-filters">
                            <div class="row g-2">
                                <div class="col-md-4">
                                    <p:outputLabel for="fromDate" value="From Date" />
                                    <p:datePicker id="fromDate" showTime="true" hourFormat="12"
                                                  showButtonBar="true" panelStyleClass="report-datepicker"
                                                  pattern="dd MMMM yyyy hh:mm a"
                                                  value="#{letterController.fromDate}" />
                                </div>
                                <div class="col-md-4">
                                    <p:outputLabel for="toDate" value="To Date" />
                                    <p:datePicker id="toDate" showTime="true" hourFormat="12"
                                                  showButtonBar="true" panelStyleClass="report-datepicker"
                                                  pattern="dd MMMM yyyy hh:mm a"
                                                  value="#{letterController.toDate}" />
                                </div>
                            </div>
                        </div>

                        <p:dataTable reflow="false" id="tbl" value="#{letterController.documentHistories}"
                                     styleClass="report-table"
                                     var="c" rowKey="#{c.id}" paginator="true"
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                                     rowsPerPageTemplate="10,25,100,{ShowAll|'All'}" rows="10"
                                     emptyMessage="No letters. Select the dates and click Process.">
                            <p:column headerText="ID"
                                      sortBy="#{c.document.id}" filterBy="#{c.document.id}" filterMatchMode="contains">
                                <h:outputText value="#{c.document.id}" />
                            </p:column>
                            <p:column headerText="Letter Date"
                                      sortBy="#{c.document.documentDate}">
                                <h:outputText value="#{c.document.documentDate}"><f:convertDateTime pattern="dd MMM yyyy" /></h:outputText>
                            </p:column>
                            <p:column headerText="Stamp Date"
                                      sortBy="#{c.document.receivedDate}">
                                <h:outputText value="#{c.document.receivedDate}"><f:convertDateTime pattern="dd MMM yyyy" /></h:outputText>
                            </p:column>
                            <p:column headerText="Assigned Date"
                                      sortBy="#{c.createdAt}">
                                <h:outputText value="#{c.createdAt}"><f:convertDateTime pattern="dd MMM yyyy hh:mm a" /></h:outputText>
                            </p:column>
                            <p:column headerText="Accepted Date"
                                      sortBy="#{c.completedAt}">
                                <h:outputText value="#{c.completedAt}"><f:convertDateTime pattern="dd MMM yyyy hh:mm a" /></h:outputText>
                            </p:column>
                            <p:column headerText="From"
                                      sortBy="#{c.document.fromInsOrUser.name}" filterBy="#{c.document.fromInsOrUser.name}" filterMatchMode="contains">
                                <h:outputText rendered="#{c.document.fromInstitution.name eq 'Personal'}" value="#{c.document.senderName}" /><h:outputText rendered="#{c.document.fromInstitution.name ne 'Personal'}" value="#{c.document.fromInsOrUser.name}" />
                            </p:column>
                            <p:column headerText="Letter Number"
                                      sortBy="#{c.document.documentNumber}" filterBy="#{c.document.documentNumber}" filterMatchMode="contains">
                                <h:outputText value="#{c.document.documentNumber}" />
                            </p:column>
                            <p:column headerText="Topic"
                                      sortBy="#{c.document.documentName}" filterBy="#{c.document.documentName}" filterMatchMode="contains">
                                <h:outputText value="#{c.document.documentName}" />
                            </p:column>
                            <p:column headerText="Comments"
                                      sortBy="#{c.comments}" filterBy="#{c.comments}" filterMatchMode="contains">
                                <h:outputText value="#{c.comments}" />
                            </p:column>
                            <p:column headerText="Actions" exportable="false" style="width:7em">
                                <div class="report-row-actions">
                                    <p:commandButton value="View" icon="pi pi-eye" ajax="false" styleClass="ui-button-info"
                                                     action="#{letterController.toLetterView()}">
                                        <f:setPropertyActionListener target="#{letterController.selected}" value="#{c.document}" />
                                    </p:commandButton>
                                </div>
                            </p:column>
                        </p:dataTable>

                        <!-- Printed register: plain monospace table for dot-matrix printers (scss/src/print.scss).
                             Hidden on screen; p:printer prints only this panel. -->
                        <h:panelGroup layout="block" id="gridPrint" styleClass="print-doc d-none d-print-block">
                            <ui:include src="/WEB-INF/includes/print_header.xhtml">
                                <ui:param name="title" value="My Assigned and Accepted Letters" />
                                <ui:param name="fromDate" value="#{letterController.fromDate}" />
                                <ui:param name="toDate" value="#{letterController.toDate}" />
                                <ui:param name="filterText" value="" />
                            </ui:include>
                            <table class="pd-table">
                                <thead>
                                    <tr>
                                        <th style="width:3%">No.</th>
                                        <th style="width:7%">ID</th>
                                        <th style="width:9%">Letter Date</th>
                                        <th style="width:9%">Stamp Date</th>
                                        <th style="width:9%">Assigned Date</th>
                                        <th style="width:9%">Accepted Date</th>
                                        <th style="width:18%">From</th>
                                        <th style="width:12%">Letter Number</th>
                                        <th>Topic</th>
                                        <th style="width:14%">Comments</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <ui:repeat value="#{letterController.documentHistories}" var="c" varStatus="s">
                                        <tr>
                                            <td><h:outputText value="#{s.index + 1}" /></td>
                                            <td><h:outputText value="#{c.document.id}" /></td>
                                            <td><h:outputText value="#{c.document.documentDate}"><f:convertDateTime pattern="dd/MM/yyyy" /></h:outputText></td>
                                            <td><h:outputText value="#{c.document.receivedDate}"><f:convertDateTime pattern="dd/MM/yyyy" /></h:outputText></td>
                                            <td><h:outputText value="#{c.createdAt}"><f:convertDateTime pattern="dd/MM/yyyy" /></h:outputText></td>
                                            <td><h:outputText value="#{c.completedAt}"><f:convertDateTime pattern="dd/MM/yyyy" /></h:outputText></td>
                                            <td><h:outputText rendered="#{c.document.fromInstitution.name eq 'Personal'}" value="#{c.document.senderName}" /><h:outputText rendered="#{c.document.fromInstitution.name ne 'Personal'}" value="#{c.document.fromInsOrUser.name}" /></td>
                                            <td><h:outputText value="#{c.document.documentNumber}" /></td>
                                            <td><h:outputText value="#{c.document.documentName}" /></td>
                                            <td><h:outputText value="#{c.comments}" /></td>
                                        </tr>
                                    </ui:repeat>
                                </tbody>
                            </table>
                            <ui:include src="/WEB-INF/includes/print_footer.xhtml">
                                <ui:param name="count" value="#{empty letterController.documentHistories ? 0 : letterController.documentHistories.size()}" />
                                <ui:param name="signatures" value="#{false}" />
                            </ui:include>
                        </h:panelGroup>
                    </p:card>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
