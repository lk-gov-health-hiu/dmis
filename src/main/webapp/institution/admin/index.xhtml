<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:p="http://primefaces.org/ui">


<h:body>

  <ui:composition template="/template1.xhtml">

    <ui:define name="content">

      <div class="container-fluid ">
        <div class="row">
          <div class="col-12 p-2">
            <p:messages />
          </div>
        </div>
        <div class="row">
          <div class="col-sm-12 col-md-3">

            <p:panel header="Institution Administration">
              <h:form>
                <div class="d-flex flex-column gap-2">
                  <p:commandButton value="Add New User" ajax="false" class="ui-button-outlined w-100"
                    action="#{menuController.toAddNewUser()}" />
                  <p:commandButton value="View Users" ajax="false" class="ui-button-outlined w-100"
                    action="#{menuController.toListUsers()}" />
                  <p:commandButton value="Favourite Institutions" ajax="false" class="ui-button-outlined w-100"
                    action="#{favouriteInstitutionController.toManageFavouriteInstitutions()}" />
                </div>
              </h:form>
            </p:panel>
          </div>
          <div class="col-sm-12 col-md-8">
            <ui:insert name="admin">
            </ui:insert>
          </div>
        </div>
      </div>
    </ui:define>
  </ui:composition>
</h:body>

</html>
