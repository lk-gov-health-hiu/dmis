<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html" 
      xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:fn="http://xmlns.jcp.org/jsp/jstl/functions" >

    <h:body>
        <ui:composition template="/institution/reports_index.xhtml">
            <ui:define name="title">
                Letter Copy / Forward Register
            </ui:define>
            <ui:define name="reports">
                <h:panelGrid columns="1" styleClass="alignTop" class="w-100">
                    <f:facet name="header">
                        <p:outputLabel value="Letter Copy / Forward Register by Unit"></p:outputLabel>
                    </f:facet>

                    <h:form>

                        <div class="row d-print-none">
                            <div class="col" >
                                <h:panelGrid columns="2" class="w-100" border="0">

                                    <h:outputLabel class="h6 fw-bold" value="From"></h:outputLabel>
                                    <p:datePicker value="#{letterController.fromDate}" pattern="dd MMMM yyyy hh:mm" showTime="true">
                                    </p:datePicker><!-- comment -->

                                    <h:outputLabel class="h6 fw-bold" value="To"></h:outputLabel>
                                    <p:datePicker value="#{letterController.toDate}" pattern="dd MMMM yyyy hh:mm" showTime="true"></p:datePicker>

                                    <h:outputLabel class="h6 fw-bold" value="Sent To"></h:outputLabel>
                                    <p:autoComplete value="#{letterController.webUserCopy}" 
                                                    completeMethod="#{letterController.completeInsOrUsersByWords}"
                                                    class="form-control"
                                                    var="insf"
                                                    itemLabel="#{insf.name}"
                                                    itemValue="#{insf}"
                                                    >
                                    </p:autoComplete>
                                </h:panelGrid>
                            </div>
                            <div class="col" >
                                <h:panelGrid columns="1"  class="w-100">
                                    <h:commandButton value="Process" class="btn btn-danger form-control"
                                                     action="#{letterController.fillForwardCopyActions}">
                                    </h:commandButton>
                                    <h:commandButton value="Print" class="btn btn-warning form-control"
                                                     >
                                        <p:printer target="gridPrint" ></p:printer>
                                    </h:commandButton>

                                    <h:commandButton value="Download" class="btn btn-success form-control">
                                        <p:dataExporter target="tbl" type="xlsx"
                                                        fileName="forward copy action list"></p:dataExporter>
                                    </h:commandButton>

                                </h:panelGrid>
                            </div>
                        </div>







                        <h:panelGrid columns="1" styleClass="alignTop" class="shadow bg-white rounded d-print-none">
                            <p:dataTable reflow="false" id="tbl" value="#{letterController.documentHistories}"
                                         rendered="true" rowIndexVar="n" var="c" paginator="true"
                                         rowKey="#{c.id}"
                                         paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                         currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                                         rowsPerPageTemplate="10,25,100,{ShowAll|'All'}" rows="10">
                                <p:columnGroup type="header">
                                    <p:row>
                                        <p:column headerText="ID" sortBy="#{c.document.id}" filterBy="#{c.document.id}"
                                                  filterMatchMode="contains">
                                        </p:column>
                                        <p:column headerText="Letter Date" sortBy="#{c.document.documentDate}" filterBy="#{c.document.documentDate}"
                                                  filterMatchMode="contains">
                                        </p:column>
                                        <p:column headerText="Stamp Date" sortBy="#{c.document.receivedDate}" 
                                                  filterBy="#{c.document.receivedDate}"
                                                  filterMatchMode="contains">
                                        </p:column>
                                        <p:column headerText="From"
                                                  sortBy="#{c.document.fromInstitution.name}" 
                                                  filterBy="#{c.document.fromInstitution.name}"
                                                  filterMatchMode="contains">
                                        </p:column>
                                        <p:column headerText="Letter Number" sortBy="#{c.document.documentNumber}" 
                                                  filterBy="#{c.document.documentNumber}"
                                                  filterMatchMode="contains">
                                        </p:column>
                                        <p:column headerText="Topic" sortBy="#{c.document.documentName}" 
                                                  filterBy="#{c.document.documentName}"
                                                  filterMatchMode="contains">
                                        </p:column>
                                        <p:column headerText="Copied/Forwarded To"
                                                  rendered="#{letterController.webUserCopy eq null}"
                                                  sortBy="#{c.toUser.person.name}" 
                                                  filterBy="#{c.toUser.person.name}"
                                                  filterMatchMode="contains">
                                        </p:column>
                                        <p:column headerText="Minute" sortBy="#{c.item.name}" 
                                                  filterBy="#{c.item.name}"
                                                  filterMatchMode="contains">
                                        </p:column>
                                        <p:column headerText="Comments" sortBy="#{c.comments}" 
                                                  filterBy="#{c.comments}"
                                                  filterMatchMode="contains">
                                        </p:column>
                                        <p:column headerText="Actions" >
                                        </p:column>
                                    </p:row>
                                </p:columnGroup>

                                <p:column >
                                    <h:outputLabel value="#{c.document.id}"></h:outputLabel>
                                </p:column>
                                <p:column headerText="Letter Date" sortBy="#{c.document.documentDate}" filterBy="#{c.document.documentDate}"
                                          filterMatchMode="contains">
                                    <h:outputLabel value="#{c.document.documentDate}">
                                        <f:convertDateTime pattern="dd MMMM yyyyy" ></f:convertDateTime>
                                    </h:outputLabel>
                                </p:column>
                                <p:column headerText="Stamp Date" sortBy="#{c.document.receivedDate}" 
                                          filterBy="#{c.document.receivedDate}"
                                          filterMatchMode="contains">
                                    <h:outputLabel value="#{c.document.receivedDate}">
                                        <f:convertDateTime pattern="dd MMMM yyyyy" ></f:convertDateTime>
                                    </h:outputLabel>
                                </p:column>
                                <p:column >
                                    <h:outputLabel value="#{c.document.senderName}"  rendered="#{c.document.fromInstitution.name eq 'Personal'}"></h:outputLabel>
                                    <h:outputLabel value="#{c.document.fromInstitution.name}"  rendered="#{c.document.fromInstitution.name ne 'Personal'}" ></h:outputLabel>
                                    <h:outputLabel value="#{c.document.fromWebUser.person.nameWithTitle}"></h:outputLabel>
                                </p:column>
                                <p:column headerText="Letter Number" sortBy="#{c.document.documentNumber}" 
                                          filterBy="#{c.document.documentNumber}"
                                          filterMatchMode="contains">
                                    <h:outputLabel value="#{c.document.documentNumber }"></h:outputLabel>
                                </p:column>
                                <p:column headerText="Topic" sortBy="#{c.document.documentName}" 
                                          filterBy="#{c.document.documentName}"
                                          filterMatchMode="contains">
                                    <h:outputLabel value="#{c.document.documentName}"></h:outputLabel>
                                </p:column>
                                <p:column headerText="Copied/Forwarded To"
                                          rendered="#{letterController.webUserCopy eq null}"
                                          sortBy="#{c.toUser.person.name}" 
                                          filterBy="#{c.toUser.person.name}"
                                          filterMatchMode="contains">
                                    <h:outputLabel value="#{c.toUser.person.name}"></h:outputLabel>
                                </p:column>
                                <p:column headerText="Minute" sortBy="#{c.item.name}" 
                                          filterBy="#{c.item.name}"
                                          filterMatchMode="contains">
                                    <h:outputLabel value="#{c.item.name}"></h:outputLabel>
                                </p:column>
                                <p:column headerText="Comments" sortBy="#{c.comments}" 
                                          filterBy="#{c.comments}"
                                          filterMatchMode="contains">
                                    <h:outputLabel value="#{c.comments}"></h:outputLabel>
                                </p:column>
                                <p:column headerText="Actions" exportable="false" >
                                    <h:commandButton value="View" action="#{letterController.toLetterView()}" >
                                        <f:setPropertyActionListener target="#{letterController.selected}" value="#{c.document}" ></f:setPropertyActionListener>
                                    </h:commandButton>
                                </p:column>
                                <p:columnGroup type="footer">
                                    <p:row>
                                        <p:column 
                                            colspan="9" rendered="#{letterController.webUserCopy ne null}"
                                            >
                                            <h:outputText value="Report generated by #{webUserController.loggedUser.person.nameWithTitle} of #{webUserController.loggedUser.institution.name}" ></h:outputText>
                                            <h:outputText value="#{session.lastAccessedTime}">
                                                <f:convertDateTime pattern="dd MMMM yyyy hh:mm a"  />
                                            </h:outputText>
                                        </p:column>
                                        <p:column 
                                            colspan="10" rendered="#{letterController.webUserCopy eq null}"
                                            >
                                            <h:outputText value="Report generated by #{webUserController.loggedUser.person.nameWithTitle} of #{webUserController.loggedUser.institution.name}" ></h:outputText>
                                            <h:outputText value="#{session.lastAccessedTime}">
                                                <f:convertDateTime pattern="dd MMMM yyyy hh:mm a"  />
                                            </h:outputText>

                                        </p:column>

                                    </p:row>
                                </p:columnGroup>
                            </p:dataTable>
                        </h:panelGrid>


                        <h:panelGroup layout="block"
                                      id="gridPrint"
                                      styleClass="d-none d-print-block">

                            <!-- Print-specific styles. Placed here so p:printer copies them into the popup's body.
                                 Rules scoped to .ptbl/.phdr/.psub classes are safe on-screen (elements are inside d-none).
                                 Body/page rules are wrapped in @media print so they never affect the screen view. -->
                            <style type="text/css">
                                table.ptbl { width: 100%; border-collapse: collapse; font-size: 8pt; font-family: 'Courier New', Courier, monospace; }
                                table.ptbl th { border: 1px solid #000; padding: 1px 3px; font-weight: bold; text-align: left; background: #fff; white-space: nowrap; }
                                table.ptbl td { border: 1px solid #000; padding: 1px 3px; vertical-align: top; word-break: break-word; }
                                .phdr { font-size: 10pt; font-weight: bold; font-family: 'Courier New', Courier, monospace; }
                                .psub, .pmeta, .pftr { font-size: 8.5pt; font-family: 'Courier New', Courier, monospace; }
                                .pmeta { margin-bottom: 4px; }
                                .pftr { margin-top: 5px; }
                                @media print {
                                    @page { size: A4 landscape; margin: 0.8cm 0.6cm; }
                                    body { font-family: 'Courier New', Courier, monospace; font-size: 9pt; color: #000; background: #fff; margin: 0; }
                                }
                            </style>

                            <!-- Institution header -->
                            <div class="phdr"><h:outputText value="#{webUserController.loggedUser.institution.name}"/></div>
                            <div class="psub">
                                <h:outputText value="#{webUserController.loggedUser.institution.address}"/>
                                <h:outputText value=" | Tel: #{webUserController.loggedUser.institution.phone}"/>
                            </div>

                            <!-- Report title and date range -->
                            <div class="pmeta">
                                <h:outputText value="Letter Copy / Forward Register"/>
                                <h:panelGroup rendered="#{letterController.webUserCopy ne null}">
                                    <h:outputText value=" — #{letterController.webUserCopy.displayName}"/>
                                </h:panelGroup>
                                <h:outputText value=" | From: "/>
                                <h:outputText value="#{letterController.fromDate}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                                </h:outputText>
                                <h:outputText value=" — To: "/>
                                <h:outputText value="#{letterController.toDate}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                                </h:outputText>
                            </div>

                            <!-- Compact plain HTML table — no PrimeFaces chrome, renders tightly for impact printers -->
                            <table class="ptbl">
                                <thead>
                                    <tr>
                                        <th style="width:3%">#</th>
                                        <th style="width:6%">ID</th>
                                        <th style="width:8%">Stamp Dt</th>
                                        <th style="width:15%">From</th>
                                        <th style="width:13%">Letter No.</th>
                                        <ui:fragment rendered="#{letterController.webUserCopy eq null}">
                                            <th style="width:14%">Fwd / Copied To</th>
                                        </ui:fragment>
                                        <th>Topic</th>
                                        <th style="width:8%">Sign</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <ui:repeat value="#{letterController.documentHistories}" var="c" varStatus="vs">
                                        <tr>
                                            <td style="text-align:center"><h:outputText value="#{vs.index + 1}"/></td>
                                            <td style="text-align:center"><h:outputText value="#{c.document.id}"/></td>
                                            <td>
                                                <h:outputText value="#{c.document.receivedDate}">
                                                    <f:convertDateTime pattern="dd/MM/yy"/>
                                                </h:outputText>
                                            </td>
                                            <td>
                                                <h:outputText value="#{c.document.senderName}" rendered="#{c.document.fromInstitution.name eq 'Personal'}"/>
                                                <h:outputText value="#{c.document.fromInstitution.name}" rendered="#{c.document.fromInstitution.name ne 'Personal'}"/>
                                                <h:outputText value=" #{c.document.fromWebUser.person.nameWithTitle}"/>
                                            </td>
                                            <td><h:outputText value="#{c.document.documentNumber}"/></td>
                                            <ui:fragment rendered="#{letterController.webUserCopy eq null}">
                                                <td>
                                                    <h:outputText value="#{c.toUser.person.name}"/>
                                                    <h:outputText value="#{c.toInstitution.name}"/>
                                                </td>
                                            </ui:fragment>
                                            <td><h:outputText value="#{c.document.documentName}"/></td>
                                            <td></td>
                                        </tr>
                                    </ui:repeat>
                                </tbody>
                            </table>

                            <!-- Footer: count + generated-by + signature row -->
                            <div class="pftr">
                                <h:outputText value="Total: #{fn:length(letterController.documentHistories)} letters  |  Generated by #{webUserController.loggedUser.person.nameWithTitle}, #{webUserController.loggedUser.institution.name}  on "/>
                                <h:outputText value="#{session.lastAccessedTime}">
                                    <f:convertDateTime pattern="dd MMMM yyyy HH:mm"/>
                                </h:outputText>
                            </div>
                            <table style="width:100%; margin-top:8px; border:none; font-size:8.5pt; font-family:'Courier New',Courier,monospace;">
                                <tr>
                                    <td style="border:none; width:34%">Received By: _____________________</td>
                                    <td style="border:none; width:33%">Received On: ____________________</td>
                                    <td style="border:none; width:33%">Signature: ______________________</td>
                                </tr>
                            </table>

                        </h:panelGroup>

                    </h:form>
                </h:panelGrid>
            </ui:define>
        </ui:composition>
    </h:body>

</html>
