<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:fn="http://xmlns.jcp.org/jsp/jstl/functions" >

    <h:body>
        <ui:composition template="/template1.xhtml">
            <ui:define name="title">
                Letter Copy/Forward by Unit Register
            </ui:define>
            <ui:define name="content">
                <p:growl />
                <h:form id="reportForm">
                    <p:card styleClass="report-card">
                        <f:facet name="title">
                            <div class="report-card-header">
                                <h:outputText value="Letter Copy/Forward by Unit Register" styleClass="report-card-title" />
                                <div class="report-card-actions">
                                    <p:commandButton value="Process" icon="pi pi-search" ajax="false"
                                                     styleClass="ui-button-warning"
                                                     action="#{letterController.fillForwardCopyActions}" />
                                    <p:commandButton value="Print" icon="pi pi-print" type="button"
                                                     styleClass="ui-button-info">
                                        <p:printer target="gridPrint" />
                                    </p:commandButton>
                                    <p:commandButton value="Download" icon="pi pi-file-excel" ajax="false"
                                                     styleClass="ui-button-success">
                                        <p:dataExporter target="tbl" type="xlsx" fileName="Letter Copy/Forward by Unit Register" />
                                    </p:commandButton>
                                </div>
                            </div>
                        </f:facet>

                        <div class="ui-fluid report-filters">
                            <div class="row g-2">
                                <div class="col-md-4">
                                    <p:outputLabel for="fromDate" value="From Date" />
                                    <p:datePicker id="fromDate" showTime="true" hourFormat="12"
                                                  showButtonBar="true" panelStyleClass="report-datepicker"
                                                  pattern="dd MMMM yyyy hh:mm a"
                                                  value="#{letterController.fromDate}" />
                                </div>
                                <div class="col-md-4">
                                    <p:outputLabel for="toDate" value="To Date" />
                                    <p:datePicker id="toDate" showTime="true" hourFormat="12"
                                                  showButtonBar="true" panelStyleClass="report-datepicker"
                                                  pattern="dd MMMM yyyy hh:mm a"
                                                  value="#{letterController.toDate}" />
                                </div>
                                <div class="col-md-4">
                                    <p:outputLabel for="person" value="Sent To" />
                                    <p:autoComplete id="person" value="#{letterController.webUserCopy}"
                                                    completeMethod="#{letterController.completeInsOrUsersByWords}"
                                                    var="insf"
                                                    placeholder="Anyone"
                                                    itemLabel="#{insf.name}"
                                                    itemValue="#{insf}" />
                                </div>
                            </div>
                        </div>

                        <p:dataTable reflow="false" id="tbl" value="#{letterController.documentHistories}"
                                     styleClass="report-table"
                                     rowIndexVar="n" var="c" paginator="true"
                                     rowKey="#{c.id}"
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                                     rowsPerPageTemplate="10,25,100,{ShowAll|'All'}" rows="10">
                            <p:column headerText="ID" sortBy="#{c.document.id}" filterBy="#{c.document.id}"
                                      filterMatchMode="contains">
                                <h:outputText value="#{c.document.id}" />
                            </p:column>
                            <p:column headerText="Letter Date" sortBy="#{c.document.documentDate}" filterBy="#{c.document.documentDate}"
                                      filterMatchMode="contains">
                                <h:outputText value="#{c.document.documentDate}">
                                    <f:convertDateTime pattern="dd MMMM yyyy" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Stamp Date" sortBy="#{c.document.receivedDate}"
                                      filterBy="#{c.document.receivedDate}"
                                      filterMatchMode="contains">
                                <h:outputText value="#{c.document.receivedDate}">
                                    <f:convertDateTime pattern="dd MMMM yyyy" />
                                </h:outputText>
                            </p:column>
                            <p:column headerText="From"
                                      sortBy="#{c.document.fromInstitution.name}"
                                      filterBy="#{c.document.fromInstitution.name}"
                                      filterMatchMode="contains">
                                <h:outputText value="#{c.document.senderName}" rendered="#{c.document.fromInstitution.name eq 'Personal'}" />
                                <h:outputText value="#{c.document.fromInstitution.name}" rendered="#{c.document.fromInstitution.name ne 'Personal'}" />
                                <h:outputText value=" #{c.document.fromWebUser.person.nameWithTitle}" />
                            </p:column>
                            <p:column headerText="Letter Number" sortBy="#{c.document.documentNumber}"
                                      filterBy="#{c.document.documentNumber}"
                                      filterMatchMode="contains">
                                <h:outputText value="#{c.document.documentNumber}" />
                            </p:column>
                            <p:column headerText="Topic" sortBy="#{c.document.documentName}"
                                      filterBy="#{c.document.documentName}"
                                      filterMatchMode="contains">
                                <h:outputText value="#{c.document.documentName}" />
                            </p:column>
                            <p:column headerText="Copied/Forwarded To"
                                      rendered="#{letterController.webUserCopy eq null}"
                                      sortBy="#{c.toInsOrUser.name}"
                                      filterBy="#{c.toInsOrUser.name}"
                                      filterMatchMode="contains">
                                <h:outputText value="#{c.toUser.person.name}" />
                                <h:outputText value=" #{c.toInstitution.name}" />
                            </p:column>
                            <p:column headerText="Minute" sortBy="#{c.item.name}"
                                      filterBy="#{c.item.name}"
                                      filterMatchMode="contains">
                                <h:outputText value="#{c.item.name}" />
                            </p:column>
                            <p:column headerText="Comments" sortBy="#{c.comments}"
                                      filterBy="#{c.comments}"
                                      filterMatchMode="contains">
                                <h:outputText value="#{c.comments}" />
                            </p:column>
                            <p:column headerText="Actions" exportable="false" style="width:7em">
                                <p:commandButton value="View" icon="pi pi-eye" ajax="false"
                                                 styleClass="ui-button-info"
                                                 action="#{letterController.toLetterView()}">
                                    <f:setPropertyActionListener target="#{letterController.selected}" value="#{c.document}" />
                                </p:commandButton>
                            </p:column>
                            <p:columnGroup type="footer">
                                <p:row>
                                    <p:column colspan="#{letterController.webUserCopy eq null ? 10 : 9}">
                                        <f:facet name="footer">
                                            <h:outputText value="Report generated by #{webUserController.loggedUser.person.nameWithTitle} of #{webUserController.loggedUser.institution.name} " />
                                            <h:outputText value="#{session.lastAccessedTime}">
                                                <f:convertDateTime pattern="dd MMMM yyyy hh:mm a" />
                                            </h:outputText>
                                        </f:facet>
                                    </p:column>
                                </p:row>
                            </p:columnGroup>
                        </p:dataTable>

                        <!-- Printed register: plain monospace table for dot-matrix printers (scss/src/print.scss).
                             Hidden on screen; p:printer prints only this panel. -->
                        <h:panelGroup layout="block" id="gridPrint" styleClass="print-doc d-none d-print-block">
                            <ui:include src="/WEB-INF/includes/print_header.xhtml">
                                <ui:param name="title" value="Letter Copy/Forward by Unit Register" />
                                <ui:param name="fromDate" value="#{letterController.fromDate}" />
                                <ui:param name="toDate" value="#{letterController.toDate}" />
                                <ui:param name="filterText" value="#{empty letterController.webUserCopy ? '' : 'Sent To: ' += letterController.webUserCopy.name}" />
                            </ui:include>
                            <table class="pd-table">
                                <thead>
                                    <tr>
                                        <th style="width:3%">No.</th>
                                        <th style="width:7%">ID</th>
                                        <th style="width:9%">Stamp Date</th>
                                        <th style="width:18%">From</th>
                                        <th style="width:12%">Letter No.</th>
                                        <ui:fragment rendered="#{letterController.webUserCopy eq null}"><th style="width:16%">Copied/Forwarded To</th></ui:fragment>
                                        <th>Topic</th>
                                        <th style="width:10%" class="pd-sign-cell">Received Sign</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <ui:repeat value="#{letterController.documentHistories}" var="c" varStatus="s">
                                        <tr>
                                            <td><h:outputText value="#{s.index + 1}" /></td>
                                            <td><h:outputText value="#{c.document.id}" /></td>
                                            <td><h:outputText value="#{c.document.receivedDate}"><f:convertDateTime pattern="dd/MM/yyyy" /></h:outputText></td>
                                            <td><h:outputText rendered="#{c.document.fromInstitution.name eq 'Personal'}" value="#{c.document.senderName}" /><h:outputText rendered="#{c.document.fromInstitution.name ne 'Personal'}" value="#{c.document.fromInstitution.name}" /><h:outputText value=" #{c.document.fromWebUser.person.nameWithTitle}" rendered="#{c.document.fromWebUser ne null}" /></td>
                                            <td><h:outputText value="#{c.document.documentNumber}" /></td>
                                            <ui:fragment rendered="#{letterController.webUserCopy eq null}"><td><h:outputText value="#{c.toUser.person.name}" /><h:outputText value=" #{c.toInstitution.name}" /></td></ui:fragment>
                                            <td><h:outputText value="#{c.document.documentName}" /></td>
                                            <td class="pd-sign-cell"></td>
                                        </tr>
                                    </ui:repeat>
                                </tbody>
                            </table>
                            <ui:include src="/WEB-INF/includes/print_footer.xhtml">
                                <ui:param name="count" value="#{empty letterController.documentHistories ? 0 : letterController.documentHistories.size()}" />
                                <ui:param name="signatures" value="#{true}" />
                            </ui:include>
                        </h:panelGroup>
                    </p:card>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>

</html>
