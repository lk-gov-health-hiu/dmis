<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:body>
        <ui:composition template="/template1.xhtml">
            <ui:define name="title">
                Institution Counts - Letters
            </ui:define>
            <ui:define name="content">
                <p:growl />
                <h:form id="reportForm">
                    <p:card styleClass="report-card">
                        <f:facet name="title">
                            <div class="report-card-header">
                                <h:outputText value="Institution Counts - Letters" styleClass="report-card-title" />
                                <div class="report-card-actions">
                                    <p:commandButton value="Process" icon="pi pi-search" ajax="false"
                                                     styleClass="ui-button-warning"
                                                     action="#{letterController.listLettersCountsByInstitution()}" />
                                    <p:commandButton value="Print" icon="pi pi-print" type="button"
                                                     styleClass="ui-button-info">
                                        <p:printer target="gridPrint" />
                                    </p:commandButton>
                                    <p:commandButton value="Download" icon="pi pi-file-excel" ajax="false"
                                                     styleClass="ui-button-success">
                                        <p:dataExporter target="tbl" type="xls" fileName="Count of Letters by Institution" />
                                    </p:commandButton>
                                </div>
                            </div>
                        </f:facet>

                        <div class="ui-fluid report-filters">
                            <div class="row g-2">
                                <div class="col-md-4">
                                    <p:outputLabel for="fromDate" value="From Date" />
                                    <p:datePicker id="fromDate" showTime="true" hourFormat="12"
                                                  showButtonBar="true" panelStyleClass="report-datepicker"
                                                  pattern="dd MMMM yyyy hh:mm a"
                                                  value="#{letterController.fromDate}" />
                                </div>
                                <div class="col-md-4">
                                    <p:outputLabel for="toDate" value="To Date" />
                                    <p:datePicker id="toDate" showTime="true" hourFormat="12"
                                                  showButtonBar="true" panelStyleClass="report-datepicker"
                                                  pattern="dd MMMM yyyy hh:mm a"
                                                  value="#{letterController.toDate}" />
                                </div>
                            </div>
                        </div>

                        <p:dataTable value="#{letterController.institutionCounts}" var="h" rowKey="#{h.institution.id}" id="tbl"
                                     styleClass="report-table"
                                     rows="25" paginator="true"
                                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                     currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                                     rowsPerPageTemplate="25,100,{ShowAll|'All'}">
                            <p:column headerText="Institution" sortBy="#{h.institution.name}">
                                <h:outputText value="#{h.institution.name}" />
                            </p:column>
                            <p:column headerText="Count" sortBy="#{h.count}" style="width:10em; text-align:right">
                                <h:outputText value="#{h.count}" />
                            </p:column>
                        </p:dataTable>

                        <!-- Printed report: plain monospace table for dot-matrix printers (scss/src/print.scss).
                             Hidden on screen; p:printer prints only this panel. -->
                        <h:panelGroup layout="block" id="gridPrint" styleClass="print-doc d-none d-print-block">
                            <ui:include src="/WEB-INF/includes/print_header.xhtml">
                                <ui:param name="title" value="Institution Counts - Letters" />
                                <ui:param name="fromDate" value="#{letterController.fromDate}" />
                                <ui:param name="toDate" value="#{letterController.toDate}" />
                            </ui:include>
                            <table class="pd-table" style="width:auto; min-width:60%">
                                <thead>
                                    <tr>
                                        <th style="width:3em">No.</th>
                                        <th>Institution</th>
                                        <th class="pd-num" style="width:8em">Count</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <ui:repeat value="#{letterController.institutionCounts}" var="h" varStatus="s">
                                        <tr>
                                            <td><h:outputText value="#{s.index + 1}" /></td>
                                            <td><h:outputText value="#{h.institution.name}" /></td>
                                            <td class="pd-num"><h:outputText value="#{h.count}" /></td>
                                        </tr>
                                    </ui:repeat>
                                </tbody>
                            </table>
                            <ui:include src="/WEB-INF/includes/print_footer.xhtml">
                                <ui:param name="count" value="#{empty letterController.institutionCounts ? 0 : letterController.institutionCounts.size()}" />
                                <ui:param name="itemName" value="institutions" />
                                <ui:param name="signatures" value="#{false}" />
                            </ui:include>
                        </h:panelGroup>
                    </p:card>
                </h:form>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
